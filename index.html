<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitácora Nathalia Navarro</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
        }
        
        body {
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        header {
            padding: 30px;
            background-color: pink;
        }

        /* Título con sombra morado neón */
        h1 {
            color: white;
            text-shadow: 0 0 5px #fff, 
                         0 0 10px #fff, 
                         0 0 20px #bc13fe, 
                         0 0 30px #bc13fe, 
                         0 0 40px #bc13fe;
            margin: 0;
        }

        main {
            flex: 1;
            padding: 40px 20px;
            max-width: 900px; 
            margin: 0 auto;
            width: 90%;
        }

        /* Estilo de Tarjetas (Fichas) */
        .semana {
            background-color: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-left: 8px solid rgb(145, 9, 143);
            text-align: left;
            transition: transform 0.3s ease;
        }

        .semana:hover {
            transform: translateY(-5px);
        }

        .semana h3 {
            margin-top: 0;
            color: rgb(145, 9, 143);
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        /* Contenedores de contenido (PDF y Video) */
        .pdf-container, .video-container {
            margin-top: 15px;
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            background-color: #000; /* Fondo oscuro para el reproductor */
        }

        .pdf-container {
            height: 500px;
        }

        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            border-top: 1px solid rgb(186, 9, 189);
            background-color: rgb(145, 9, 143);
            color: white;
        }

        /* Zoom en el logo */
        footer img {
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        footer img:hover {
            transform: scale(1.15);
        }
    </style>
</head>
<body>

    <header>
        <h1>Bitácora segunda y tercera unidad</h1>
    </header>

    <main>
        <!-- Ficha 1: Vista previa de PDF -->
        <div class="semana">
            <h3>Tarea: Investigación de Conceptos</h3>
            <p>A continuación se presenta el documento PDF con los detalles de la unidad:</p>
            
            <div class="pdf-container">
                <embed src="https://colegiocapouilliez.sharepoint.com/sites/11F-TECNOLOGAIIU/_layouts/15/embed.aspx?uniqueId=4478d726-8acb-4df5-a2c6-b1b71f161b69&embed={%22nb%22:true,%22o%22:%22https://assignments.edu.cloud.microsoft%22,%22itf%22:%22rc%22,%22af%22:false}" type="application/pdf" width="100%" height="100%" />
            </div>
        </div>

        <!-- Ficha 2: Video MP4 Local -->
        <div class="semana">
            <h3>Reflexión Semanal: Video de Evidencia</h3>
            <p>En esta sección puedes observar el video explicativo de las actividades realizadas en clase:</p>
            
            <div class="video-container">
                <!-- REEMPLAZA "tu_video.mp4" por el nombre de tu archivo de video -->
                <video width="100%" controls>
                    <source src="c:\Users\Alumno Capouilliez\Documents\Navarro11F\rescursos\Video de simulación.mp4" type="video/mp4">
                    Tu navegador no soporta la reproducción de videos.
                </video>
            </div>
        </div>
    </main>

    <footer>
        <span>@naati_navarro</span>
        <img src="https://www.capouilliez.edu.gt/assets/img/logo.png" height="50" width="200" alt="Logo Colegio">
    </footer>

</body>
</html>
